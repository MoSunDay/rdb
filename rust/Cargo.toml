[workspace]
members = ["bench"]
resolver = "2"

[package]
name = "rdb"
version = "0.1.0"
edition = "2021"

[dependencies]
rocksdb = "0.24"
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10"
hex = "0.4"
prometheus = "0.13"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
futures = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Only used for TCP keepalive on raft sockets; already in the tree via tokio.
# The "all" feature unlocks `TcpKeepalive::with_retries` (TCP_KEEPCNT).
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[profile.dev]
opt-level = 0
debug = 1
