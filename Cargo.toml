[workspace]
members = ["bench"]
resolver = "2"

[package]
name = "rdb"
version = "0.3.0"
edition = "2021"

[[bin]]
# The process entry needs the full stack (raft/SQL/monitor); under a
# store-only build (`--no-default-features --features store`) the bin is
# skipped entirely so the embedder never compiles it.
name = "rdb"
path = "src/main.rs"
required-features = ["full"]

[features]
# `full` = the rdb server stack (default); `store` = embedder-only slice
# exposing just the RocksDB KV layer. `store` is deliberately independent
# of `full` (`default-features = false, features = ["store"]`).
default = ["full"]
full = [
    "dep:async-trait",
    "dep:futures",
    "dep:jieba-rs",
    "dep:openraft",
    "dep:opensrv-mysql",
    "dep:prometheus",
    "dep:regex",
    "dep:serde_yaml",
    "dep:sha1",
    "dep:socket2",
    "dep:sqlparser",
    # The embedded engine's code is compiled into every full build and
    # runtime-gated by conf (`turso_engine` + `turso_db_dir`); without
    # the feature the e2e binary could not carry the engine at all.
    "turso-engine",
    "dep:tracing-subscriber",
]
store = []
# Embedded turso engine (pure-Rust SQLite-compatible, tursodatabase/turso).
# Runtime-gated by conf `turso_engine` + `turso_db_dir`; pinned pre-1.0
# version on purpose (R1 in plans/2026-11-09-turso-engine).
turso-engine = ["dep:turso"]
# Produce-side decompression of compressed RecordBatches (gzip/snappy/
# lz4). Pure-Rust backends only (flate2=miniz_oxide, snap, lz4_flex);
# zstd stays out (C dependency). Deliberately NOT in `default`/`full`:
# the stock build keeps a zero-new-dependency tree and rejects
# compressed batches with error 76 (UNSUPPORTED_COMPRESSION_TYPE).
kafka-codecs = [
    "dep:flate2",
    "dep:snap",
    "dep:lz4_flex",
]

[dependencies]
rocksdb = "0.24"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10"
hex = "0.4"
# Heavy, non-store dependencies below are optional and pulled in by `full`.
prometheus = { version = "0.13", optional = true }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"], optional = true }
futures = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
# Only used for TCP keepalive on raft sockets; already in the tree via tokio.
# The "all" feature unlocks `TcpKeepalive::with_retries` (TCP_KEEPCNT).
socket2 = { version = "0.6", features = ["all"], optional = true }
# MySQL-protocol frontend (M1): shim + SQL parsing + native-password auth.
opensrv-mysql = { version = "=0.7.0", default-features = false, optional = true }
sqlparser = { version = "=0.62.0", optional = true }
# Embedded turso engine (feature `turso-engine`): pure-Rust, SQLite-format
# compatible (files + dialect + C API, tracking 3.50.4). Pinned exact:
# pre-1.0 API churn (upgrade = dedicated mini-plan).
# default-features off: turso's default `mimalloc` feature declares
# #[global_allocator] inside the crate, which would swap the whole rdb
# process to mimalloc; `fts` is unneeded (verified by T0 smoke, see
# plans/2026-11-09-turso-engine/00-research.md D1/⑨).
turso = { version = "=0.9.0-pre.2", default-features = false, optional = true }
sha1 = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }
# Chinese word segmentation for the FT.* search tokenizer (embedded dict).
jieba-rs = { version = "0.10", optional = true }
# REGEXP/RLIKE (M1): pure-Rust engine; default features only (unicode
# case folding stays out, LIKE/REGEXP are bytewise per COMPAT.md).
regex = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
# Kafka produce-side compression codecs (feature `kafka-codecs`): all
# pure-Rust backends so the optional feature adds no C-toolchain needs.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
snap = { version = "1", optional = true }
lz4_flex = { version = "0.11", optional = true }

[dev-dependencies]
# start_paused clock-control for the state.rs advance-tick tests; a
# dev-dependency entry unifies the feature set, so test builds keep
# test-util while normal builds compile tokio without it.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
# tests/sql/sql_e2e.rs hand-rolls the mysql_native_password scramble.
sha1 = "0.10"
mysql_async = "0.37.0"

# Env-isolation carve-outs (tests-reorg 2026-11-10): these three set
# RAFT_BOOTSTRAP process-wide, so they stay standalone targets instead
# of modules inside the group crates (tests/{sql,cluster}/).
[[test]]
name = "sql_oracle_cluster_e2e"
path = "tests/sql/sql_oracle_cluster_e2e.rs"

[[test]]
name = "ha_failover"
path = "tests/cluster/ha_failover.rs"

[[test]]
name = "raft_cluster_e2e"
path = "tests/cluster/raft_cluster_e2e.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[profile.dev]
opt-level = 0
debug = 1
