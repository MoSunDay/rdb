[workspace]
members = ["bench"]
resolver = "2"

[package]
name = "rdb"
version = "0.2.1"
edition = "2021"

[[bin]]
# The process entry needs the full stack (raft/SQL/monitor); under a
# store-only build (`--no-default-features --features store`) the bin is
# skipped entirely so the embedder never compiles it.
name = "rdb"
path = "src/main.rs"
required-features = ["full"]

[features]
# `full` = the rdb server stack (default); `store` = embedder-only slice
# exposing just the RocksDB KV layer. `store` is deliberately independent
# of `full` (`default-features = false, features = ["store"]`).
default = ["full"]
full = [
    "dep:async-trait",
    "dep:futures",
    "dep:jieba-rs",
    "dep:openraft",
    "dep:opensrv-mysql",
    "dep:prometheus",
    "dep:serde_yaml",
    "dep:sha1",
    "dep:socket2",
    "dep:sqlparser",
    "dep:tracing-subscriber",
]
store = []

[dependencies]
rocksdb = "0.24"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10"
hex = "0.4"
# Heavy, non-store dependencies below are optional and pulled in by `full`.
prometheus = { version = "0.13", optional = true }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"], optional = true }
futures = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
# Only used for TCP keepalive on raft sockets; already in the tree via tokio.
# The "all" feature unlocks `TcpKeepalive::with_retries` (TCP_KEEPCNT).
socket2 = { version = "0.6", features = ["all"], optional = true }
# MySQL-protocol frontend (M1): shim + SQL parsing + native-password auth.
opensrv-mysql = { version = "=0.7.0", default-features = false, optional = true }
sqlparser = { version = "=0.62.0", optional = true }
sha1 = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }
# Chinese word segmentation for the FT.* search tokenizer (embedded dict).
jieba-rs = { version = "0.10", optional = true }
serde_yaml = { version = "0.9", optional = true }

[dev-dependencies]
# start_paused clock-control for the state.rs advance-tick tests; a
# dev-dependency entry unifies the feature set, so test builds keep
# test-util while normal builds compile tokio without it.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
# tests/sql_e2e.rs hand-rolls the mysql_native_password scramble.
sha1 = "0.10"
mysql_async = "0.37.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[profile.dev]
opt-level = 0
debug = 1
