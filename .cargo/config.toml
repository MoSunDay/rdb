# tokio_unstable enables Builder::disable_lifo_slot, which we MUST call:
# the multi-thread scheduler's LIFO slot loses task wakeups on this host
# (all workers park while runnable tasks sit queued; freezes 6s+).
# See COMPAT.md "tokio LIFO slot freeze" for the full root cause.
# rustdocflags mirror rustflags because rustdoc does NOT read
# [build] rustflags -- without it the doc-test build would compile the
# lib without the cfg and src/build_guard.rs would (wrongly) fire.
[build]
rustflags = ["--cfg", "tokio_unstable"]
rustdocflags = ["--cfg", "tokio_unstable"]

# Integration e2e suites spawn real multi-listener rdb nodes (each node
# derives ~10 bound ports from one free-:0 probe), so same-process test
# parallelism directly drives free-port TOCTOU races (EADDRINUSE
# respawns, RocksDB same-dir LOCK clashes when per-test dir names
# collide on the probed port). Capping at 4 matches the CI runner core
# count and keeps spawn pressure at the pre-reorg level regardless of
# host size (tests/*/main.rs group crates run up to 161 tests per
# process -- tests-reorg 2026-11-10).
[env]
RUST_TEST_THREADS = "4"
