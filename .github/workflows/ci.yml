# Quality gate for the Rust implementation (the only maintained one):
# fmt -> clippy (-D warnings) -> full test suite -> release build.
# .cargo/config.toml (committed) sets --cfg tokio_unstable for every
# cargo invocation, so the LIFO-slot workaround applies in CI as locally.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # librocksdb-sys compiles bundled C/C++ sources (rocksdb + lz4/
      # snappy/zstd/zlib/bzip2); clang covers the C toolchain and any
      # bindgen-style probing without depending on the runner image.
      - name: Install rocksdb build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        # Anonymous API users cannot download run logs, so surface the
        # per-test verdicts as check-run annotations (readable without
        # auth). `timeout-minutes` turns any future hang into a fast
        # red instead of burning the 360-min job cap.
        timeout-minutes: 60
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/test-out.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            names=$(grep '^---- ' /tmp/test-out.log | sed 's/^---- //; s/ stdout ----$//' | head -10 | paste -sd, -)
            echo "::error title=test-failures::${names:-no-test-names-detected}"
          fi
          exit "$rc"

      - name: release build
        run: cargo build --release --workspace

      # Guard steps: prove src/build_guard.rs actually fires when the
      # tokio_unstable cfg is missing (empty RUSTFLAGS overrides the
      # committed .cargo/config.toml build.rustflags).
      - name: "build guard: full build must fail without tokio_unstable cfg"
        run: |
          if RUSTFLAGS='' cargo build --release >/tmp/guard.log 2>&1; then
            echo '::error::full build succeeded without --cfg tokio_unstable (guard did not fire)'
            exit 1
          fi
          grep -q 'build_guard' /tmp/guard.log || {
            echo '::error::build failed but not via the build guard:'; cat /tmp/guard.log; exit 1;
          }
      - name: "build guard: store-only slice is exempt"
        run: RUSTFLAGS='' cargo build --release --no-default-features --features store

  release:
    name: tag release (linux-amd64)
    needs: rust
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install rocksdb build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: release build
        run: cargo build --release --workspace
      - name: package
        run: tar -czf "rdb-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" -C target/release rdb
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "rdb-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            --title "rdb ${GITHUB_REF_NAME}" \
            --generate-notes
